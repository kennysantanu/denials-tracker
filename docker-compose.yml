# Denials Tracker — App deployment (default)
#
# Usage:
#   App only (existing/external Supabase — Supabase Cloud or external host):
#     docker compose up -d
#
#   App + bundled self-hosted Supabase (also runs migrate against local DB):
#     docker compose --profile with-local-db -f docker-compose.yml -f docker-compose.supabase.yml up -d
#
#   App + run migrations against an existing DB (e.g. Supabase Cloud):
#     docker compose --profile migrate up -d
#
# Notes:
#   - The image is built from source on first deploy. Portainer Git stacks
#     and `docker compose up` both build locally; no registry is used.
#   - `.env` is optional (Portainer injects env vars via the stack form).
#
#   Or use the install script: ./install.sh / ./install.ps1

name: denials-tracker

services:
  app:
    container_name: denials-tracker-app
    build:
      context: .
    image: denials-tracker:latest
    pull_policy: build
    env_file:
      - path: .env
        required: false
    ports:
      - '${HOST_PORT:-3000}:3000'
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
      PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_INTERNAL_URL: ${SUPABASE_INTERNAL_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      PASSWORD_EXPIRY_DAYS: ${PASSWORD_EXPIRY_DAYS:-90}
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional one-shot migration runner.
  # Only starts when the `migrate` or `with-local-db` profile is enabled.
  migrate:
    container_name: denials-tracker-migrate
    image: postgres:15-alpine
    profiles: ['migrate', 'with-local-db']
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/migrate.sh:/migrate.sh:ro
    entrypoint: ['/bin/sh', '/migrate.sh']
    restart: 'no'
